apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 2
  selector:
    matchLabels: { app: transit-frontend }
  template:
    metadata:
      labels: { app: transit-frontend }
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        ports:
        - containerPort: {{ .Values.frontend.port }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.frontend.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: transit-frontend
spec:
  selector: { app: transit-frontend }
  ports:
  - name: http
    port: 80
    targetPort: {{ .Values.frontend.port }}
