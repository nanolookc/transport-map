apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: {{ .Values.domain | quote }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: transit-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transit-frontend
            port:
              number: 80
