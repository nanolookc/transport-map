apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: transit-strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: {{ .Values.domain | quote }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: transit-backend
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: transit-frontend
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transit-api-mw
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-transit-strip-api@kubernetescrd"
spec:
  rules:
  - host: {{ .Values.domain | quote }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: transit-backend
            port:
              number: 80
