name: build-images

on:
  push:
    branches: [ "main" ]

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: ghcr.io/nanolookc/transport-map-frontend:sha-${{ github.sha }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: ghcr.io/nanolookc/transport-map-backend:sha-${{ github.sha }}

      - name: Checkout cluster repo
        uses: actions/checkout@v4
        with:
          repository: nanolook-org/cluster
          ref: main
          fetch-depth: 0
          token: ${{ secrets.CLUSTER_REPO_TOKEN }}
          path: cluster

      - name: Update cluster values
        run: |
          python3 cluster/scripts/update-image-tags.py \
            cluster/values/transit/values.yaml \
            frontend.image.tag=sha-${GITHUB_SHA} \
            backend.image.tag=sha-${GITHUB_SHA}

      - name: Commit cluster values
        run: |
          cd cluster
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- values/transit/values.yaml; then
            echo "No cluster changes to commit"
            exit 0
          fi

          git add values/transit/values.yaml
          git commit -m "chore(transit): deploy sha-${GITHUB_SHA}"
          git pull --rebase origin main
          git push origin HEAD:main
